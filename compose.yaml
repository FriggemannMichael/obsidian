services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: tattoo_studio
            POSTGRES_PASSWORD: tattoo-local
            POSTGRES_USER: tattoo
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tattoo -d tattoo_studio"]
            interval: 5s
            timeout: 3s
            retries: 10
        ports:
            - "5432:5432"
        volumes:
            - tattoo_postgres_data:/var/lib/postgresql

volumes:
    tattoo_postgres_data:
